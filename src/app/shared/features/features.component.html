<!--END ABOUT US-->
<section class="section bg-light" id="features">
  <div class="container">
    <div class="row vertical-content mt-5">
      <div class="col-lg-5">
        <div class="features-box">
          <h3>{{ 'features.title' | translate }}</h3>
          <p class="text-muted web-desc">
            {{ 'features.description' | translate }}
          </p>
          <ul class="text-muted list-unstyled mt-4 features-item-list">
            <li class="">{{ 'features.item1' | translate }}</li>
            <li class="">{{ 'features.item2' | translate }}</li>
            <li class="">{{ 'features.item3' | translate }}</li>
            <li class="">
              {{ 'features.item4' | translate }}
            </li>
          </ul>
          <a (click)="openModal()" class="btn btn-primary mt-4"
            >{{ 'features.getFreeQuotes' | translate }} <i class="mdi mdi-arrow-right"></i
          ></a>
        </div>
      </div>
      <div class="col-lg-7">
        <div class="features-img features-right text-right">
          <img
            src="assets/images/online-world.svg"
            alt="macbook image"
            class="img-fluid"
          />
        </div>
      </div>
    </div>
  </div>
</section>
<!--END ABOUT US-->

<p-dialog
  [header]="'features.formQuote' | translate"
  [(visible)]="displayModal"
  [modal]="true"
  [responsive]="true"
  [style]="{ width: '50%' }"
>
  <!-- Conteúdo do modal -->
  <div class="modal-content">
    <app-quote></app-quote>
  </div>
</p-dialog>
